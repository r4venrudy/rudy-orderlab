name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: dotnet run --project tests/OrderLab.Tests -c Release
      - run: dotnet build src/OrderLab.Cli -c Release
      - name: Independent command oracle and real queue adapter
        shell: bash
        run: |
          set -euo pipefail
          bin=src/OrderLab.Cli/bin/Release/net10.0/orderlab
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin="$bin.exe"; fi
          python tests/integration.py "$bin" .
          mkdir -p artifacts
          dotnet run --project examples/OrderLab.Sample -c Release -- artifacts/queue-history.json
      - name: Fully checked benchmark workloads
        shell: bash
        run: dotnet run --project benchmarks/OrderLab.Benchmarks -c Release > artifacts/benchmark.json
