name: Release verified packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            target: linux-x64
          - os: windows-2022
            rid: win-x64
            target: windows-x64
          - os: macos-15
            rid: osx-arm64
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: dotnet publish src/OrderLab.Cli -c Release -r ${{ matrix.rid }} --self-contained true -p:PackAsTool=false -o stage/bin --source https://api.nuget.org/v3/index.json
      - name: Test installed native layout and package evidence
        shell: bash
        run: |
          set -euo pipefail
          bin=stage/bin/orderlab
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin="$bin.exe"; fi
          python tests/integration.py "$bin" .
          python tools/package.py stage '${{ matrix.target }}' --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.target }}
          path: dist/orderlab-*
          if-no-files-found: error
  tool:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Pack and verify an isolated local-feed tool installation
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dotnet pack src/OrderLab.Cli -c Release -o dist
          test -f "dist/Rudy.OrderLab.Tool.$version.nupkg"
          dotnet tool install Rudy.OrderLab.Tool --version "$version" --tool-path stage/tool --add-source "$PWD/dist" --configfile NuGet.Config
          python tests/integration.py stage/tool/orderlab .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-dotnet-tool
          path: dist/*.nupkg
          if-no-files-found: error
  publish:
    needs: [package, tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Publish checksummed packages after every validation job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum orderlab-* *.nupkg > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release-assets/orderlab-* release-assets/*.nupkg release-assets/SHA256SUMS.txt --title "Rudy OrderLab $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --prerelease
